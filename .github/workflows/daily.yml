name: Daily Urdu Short

on:
  schedule:
    # TWO videos a day, at fixed slots, in Pakistan time (UTC+5):
    #
    #   01:00 UTC = 06:00 PKT   the ayah or the hadith
    #   13:00 UTC = 18:00 PKT   the silent text card
    #
    # The evening slot was the habit video until 2026-08-22. It was the most
    # expensive thing this repo made — eight scenes, eight TTS calls — and on a
    # page whose only engaging post was a verse it had returned nothing. The
    # text card keeps the properties the morning slot gets right (short, quiet,
    # worth screenshotting) and costs no TTS at all.
    #
    # habit is not deleted, only unscheduled: it is still in KINDS and still in
    # the dropdown below, so putting it back is changing one word here.
    #
    # Which one runs is decided by the CLOCK, not by the alternation — see the
    # "Pick today's kind" step. A channel that posts the same kind of thing at
    # the same time every day is one a viewer can form a habit around, and the
    # two audiences are awake at different hours anyway.
    #
    # GitHub's scheduler is best-effort and routinely runs a cron ten to thirty
    # minutes late under load. Fine for both slots; not worth correcting.
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: 'Override the queue — a topic, or "quran 94:5" / "hadith 5907"'
        required: false
      kind:
        description: "Force today's kind instead of alternating"
        type: choice
        options: ["", "habit", "scripture", "text"]
        default: ""
      dry_run:
        description: "Build only, publish nothing"
        type: boolean
        default: false

# The last step commits data/posted_log.json back. Without this the default
# GITHUB_TOKEN is read-only on a new repo and that push fails — after the video
# has already published, so the next run re-picks the same topic.
permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    # Measured, not guessed. Run #1 was cancelled at 25 minutes with the render
    # still going — a 7-second scene took 220s at RENDER_SCALE=2, so eight of
    # them could never fit. At the measured scale a build is well under 15
    # minutes; this leaves room for a slow runner without letting a genuinely
    # hung Playwright call burn hours of the account's minutes.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # Generated rather than trusted as a committed binary. A no-op when the
      # files are already in the repo. A scripture day uses this instead of a
      # music bed, and pick_music refuses to substitute music for it.
      - name: Ensure the ambient bed exists
        run: python make_ambience.py

      # The morning slot is scripture, the evening slot is the habit video.
      # Read off the cron that actually fired, so two schedules do not need two
      # copies of this whole job. A manual run uses whatever `kind` was chosen
      # in the dialog; choosing nothing falls through to config.CONTENT_KIND,
      # which alternates.
      - name: Pick today's kind
        id: kind
        run: |
          case "${{ github.event.schedule }}" in
            "0 1 * * *")  KIND=scripture ;;
            "0 13 * * *") KIND=text ;;
            *)            KIND="${{ github.event.inputs.kind }}" ;;
          esac
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "This run builds: ${KIND:-（alternating）}"

      - name: Build the video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # A VARIABLE, never a secret. Which model to call is a code decision,
          # and a secret is the one value nobody can read back — run #3 failed
          # its first tier with `HTTP 400 for model '***'`, masked, because the
          # model name was sitting in a secret. Left unset, config.py's list
          # applies. Comma-separated, tried in order.
          GEMINI_TTS_MODELS: ${{ vars.GEMINI_TTS_MODELS }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          # Tier 3 of the voice ladder; the run works without it.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # Background fallback only — unused on a day Pixabay answers.
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          REPLICATE_BG_MODE: ${{ vars.REPLICATE_BG_MODE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          # The marketing pages that also carry the Qur'an videos. One secret
          # holding JSON — see config.syndicate_pages(). Unset means no
          # syndication at all, which is the safe default and the current one.
          FB_SYNDICATE: ${{ secrets.FB_SYNDICATE }}
          FB_SYNDICATE_EVERY: ${{ vars.FB_SYNDICATE_EVERY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          NICHE: ${{ vars.NICHE || 'daily' }}
          # "mixed" alternates habit and scripture day by day, counting posts
          # rather than dates. "habit" or "scripture" pins the channel to one.
          CONTENT_KIND: ${{ vars.CONTENT_KIND || 'mixed' }}
          # Editorial, changeable without a commit: which Urdu translation of
          # the Qur'an, and which reciter.
          QURAN_UR_EDITION: ${{ vars.QURAN_UR_EDITION }}
          QURAN_RECITER: ${{ vars.QURAN_RECITER }}
          # Who READS the translation. "human" is Shamshad Ali Khan's recorded
          # reading — the only recorded Urdu edition that exists, so this is a
          # choice between him and the channel's own narrator ("voice"), not a
          # choice between readers. QURAN_UR_RECITER is here for the day the
          # CDN carries a second one; changing QURAN_UR_EDITION without also
          # setting this to "voice" puts one translation on screen and a
          # different one in the audio.
          TARJUMA_AUDIO: ${{ vars.TARJUMA_AUDIO }}
          QURAN_UR_RECITER: ${{ vars.QURAN_UR_RECITER }}
          # Pins the shape for a run instead of letting length and rotation
          # pick it — "full", "recitation_first", "tarjuma_only",
          # "tarjuma_first". Left unset in normal operation.
          SCRIPTURE_SHAPE: ${{ vars.SCRIPTURE_SHAPE }}
          RENDER_SCALE: ${{ vars.RENDER_SCALE }}
          # Without this, CI sees a pipe rather than a terminal, Python buffers
          # stdout, and the whole log arrives at once when the process exits —
          # so a 24-minute build that was working fine looked identical to a
          # hang for its entire duration. This is why run #1 showed nothing.
          PYTHONUNBUFFERED: "1"
        run: |
          python -u main.py \
            ${{ github.event.inputs.topic && format('--topic "{0}"', github.event.inputs.topic) || '' }} \
            ${{ steps.kind.outputs.kind && format('--kind {0}', steps.kind.outputs.kind) || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && ' ' || '--post' }}

      # Kept whatever happened. When a video reads badly the file and the script
      # that produced it are the only two things worth looking at, and by the
      # time anyone looks the runner is long gone.
      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: out/
          retention-days: 14

      # Runs even when a platform failed. The log is what stops tomorrow
      # re-picking today's topic, and it is written the moment the video is
      # built — losing it because a Page was not set up yet means the rotation
      # never starts.
      - name: Commit the posted log
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          test -f data/posted_log.json || exit 0
          git config user.name "urdu-shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posted_log.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: posted log [skip ci]"
          # A build takes ~15 minutes, which is plenty of time for a commit to
          # land on main from somewhere else — and then this push is rejected
          # and the log never arrives, so the next run repeats today's topic.
          # Rebase and retry rather than failing the job over a race.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race (attempt $i) — retrying"
            sleep 5
          done
          echo "could not push the posted log after 3 attempts"
          exit 1
