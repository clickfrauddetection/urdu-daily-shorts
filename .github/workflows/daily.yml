name: Daily Urdu Short

on:
  schedule:
    # 03:30 UTC = 08:30 PKT. Posting lands before the morning commute rather
    # than during the night, which is when this audience is actually scrolling.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: 'Override the queue — a topic, or "quran 94:5" / "hadith 5907"'
        required: false
      kind:
        description: "Force today's kind instead of alternating"
        type: choice
        options: ["", "habit", "scripture"]
        default: ""
      dry_run:
        description: "Build only, publish nothing"
        type: boolean
        default: false

# The last step commits data/posted_log.json back. Without this the default
# GITHUB_TOKEN is read-only on a new repo and that push fails — after the video
# has already published, so the next run re-picks the same topic.
permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    # Measured, not guessed. Run #1 was cancelled at 25 minutes with the render
    # still going — a 7-second scene took 220s at RENDER_SCALE=2, so eight of
    # them could never fit. At the measured scale a build is well under 15
    # minutes; this leaves room for a slow runner without letting a genuinely
    # hung Playwright call burn hours of the account's minutes.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # Generated rather than trusted as a committed binary. A no-op when the
      # files are already in the repo. A scripture day uses this instead of a
      # music bed, and pick_music refuses to substitute music for it.
      - name: Ensure the ambient bed exists
        run: python make_ambience.py

      - name: Build the video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # A VARIABLE, never a secret. Which model to call is a code decision,
          # and a secret is the one value nobody can read back — run #3 failed
          # its first tier with `HTTP 400 for model '***'`, masked, because the
          # model name was sitting in a secret. Left unset, config.py's list
          # applies. Comma-separated, tried in order.
          GEMINI_TTS_MODELS: ${{ vars.GEMINI_TTS_MODELS }}
          GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
          # Tier 3 of the voice ladder; the run works without it.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # Background fallback only — unused on a day Pixabay answers.
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          REPLICATE_BG_MODE: ${{ vars.REPLICATE_BG_MODE }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          NICHE: ${{ vars.NICHE || 'daily' }}
          # "mixed" alternates habit and scripture day by day, counting posts
          # rather than dates. "habit" or "scripture" pins the channel to one.
          CONTENT_KIND: ${{ vars.CONTENT_KIND || 'mixed' }}
          # Editorial, changeable without a commit: which Urdu translation of
          # the Qur'an, and which reciter.
          QURAN_UR_EDITION: ${{ vars.QURAN_UR_EDITION }}
          QURAN_RECITER: ${{ vars.QURAN_RECITER }}
          RENDER_SCALE: ${{ vars.RENDER_SCALE }}
          # Without this, CI sees a pipe rather than a terminal, Python buffers
          # stdout, and the whole log arrives at once when the process exits —
          # so a 24-minute build that was working fine looked identical to a
          # hang for its entire duration. This is why run #1 showed nothing.
          PYTHONUNBUFFERED: "1"
        run: |
          python -u main.py \
            ${{ github.event.inputs.topic && format('--topic "{0}"', github.event.inputs.topic) || '' }} \
            ${{ github.event.inputs.kind && format('--kind {0}', github.event.inputs.kind) || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && ' ' || '--post' }}

      # Kept whatever happened. When a video reads badly the file and the script
      # that produced it are the only two things worth looking at, and by the
      # time anyone looks the runner is long gone.
      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: out/
          retention-days: 14

      # Runs even when a platform failed. The log is what stops tomorrow
      # re-picking today's topic, and it is written the moment the video is
      # built — losing it because a Page was not set up yet means the rotation
      # never starts.
      - name: Commit the posted log
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          test -f data/posted_log.json || exit 0
          git config user.name "urdu-shorts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posted_log.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: posted log [skip ci]"
          # A build takes ~15 minutes, which is plenty of time for a commit to
          # land on main from somewhere else — and then this push is rejected
          # and the log never arrives, so the next run repeats today's topic.
          # Rebase and retry rather than failing the job over a race.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race (attempt $i) — retrying"
            sleep 5
          done
          echo "could not push the posted log after 3 attempts"
          exit 1
